<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Guard</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="hero-mark" aria-hidden="true">◆</div>
      <div>
        <h1 data-i18n="settingsTitle"></h1>
        <p data-i18n="settingsSubtitle"></p>
      </div>
    </header>

    <section class="card protect-card">
      <label class="switch-row" for="enabled">
        <span>
          <strong data-i18n="enabledLabel"></strong>
          <small data-i18n="enabledHint"></small>
        </span>
        <input id="enabled" type="checkbox">
      </label>
    </section>

    <section class="section-block two-column" aria-label="My rules">
      <div class="card list-card">
        <h2 data-i18n="customTitle"></h2>
        <p data-i18n="customHint"></p>
        <label for="customHosts" data-i18n="hostListLabel"></label>
        <textarea id="customHosts" rows="9" spellcheck="false"></textarea>
      </div>
      <div class="card list-card">
        <h2 data-i18n="blockedTitle"></h2>
        <p data-i18n="blockedHint"></p>
        <label for="blockedHosts" data-i18n="hostListLabel"></label>
        <textarea id="blockedHosts" rows="9" spellcheck="false"></textarea>
      </div>
      <div class="card list-card">
        <h2 data-i18n="broadTitle"></h2>
        <p data-i18n="broadHint"></p>
        <label for="broadDomains" data-i18n="hostListLabel"></label>
        <textarea id="broadDomains" rows="9" spellcheck="false"></textarea>
      </div>
    </section>


    <section class="section-block" aria-labelledby="imports-heading">
      <div class="section-heading">
        <h2 id="imports-heading" data-i18n="importsTitle"></h2>
        <p data-i18n="importsHint"></p>
      </div>
      <div class="card import-controls">
        <label for="importFile" data-i18n="importFileLabel"></label>
        <input id="importFile" type="file" accept=".json,application/json">
        <label for="importUrl" data-i18n="importUrlLabel"></label>
        <div class="import-url-row">
          <input id="importUrl" type="url" placeholder="https://example.org/list.json" autocomplete="off" spellcheck="false">
          <button id="previewRemote" type="button" data-i18n="previewRemote"></button>
        </div>
        <p data-i18n="importSecurityHint"></p>
        <p data-i18n="importBlockHint"></p>
      </div>
      <div id="importPreview" class="card import-preview" hidden></div>
      <div id="importedLists" class="imported-grid"></div>
    </section>

    <p class="footnote" data-i18n="hostFormatHint"></p>
    <p class="footnote" data-i18n="exactHostExample"></p>
    <div class="save-bar">
      <p id="status" role="status" aria-live="polite"></p>
      <button id="save" type="button" data-i18n="saveSettings"></button>
    </div>
  </main>
  <script src="english.js"></script>
  <script src="locale.js"></script>
  <script src="policy.js"></script>
  <script src="import-list.js"></script>
  <script src="options.js"></script>
</body>
</html>
