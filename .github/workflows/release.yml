name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require YubiKey-signed release tag
        run: |
          set -eu
          # checkout may replace the annotated tag ref with its peeled commit.
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          test "$(sha256sum release/allowed_signers | cut -d ' ' -f1)" = \
            'a67f549241b7e63314f7fa1df02a07f353964a1e35da3cf0405d862632e3a5fb'
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/release/allowed_signers" \
            verify-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tag and build
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          npm test
          npm run package
          cd dist
          sha256sum "link-guard-$version.xpi" > SHA256SUMS
      - name: Publish regular release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          test -s "release/notes/$version.md"
          gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/SHA256SUMS \
            --verify-tag --latest --title "Link Guard $version" \
            --notes-file "release/notes/$version.md"
