name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require YubiKey-signed release tag
        run: |
          set -eu
          # checkout may replace the annotated tag ref with its peeled commit.
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          test "$(sha256sum release/allowed_signers | cut -d ' ' -f1)" = \
            'a67f549241b7e63314f7fa1df02a07f353964a1e35da3cf0405d862632e3a5fb'
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/release/allowed_signers" \
            verify-tag "$GITHUB_REF_NAME"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tag and build
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          npm test
          npm run package
          cd dist
          sha256sum "link-guard-$version.xpi" > SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/SHA256SUMS --verify-tag --prerelease --generate-notes
