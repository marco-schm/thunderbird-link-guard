<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Link Guard">
  <title>Link Guard</title>
  <!-- Single-colour mark: the shield takes currentColor (black by default) and the
       chain links are cut out, so it works on any background and with context-fill. -->
  <defs>
    <clipPath id="lg-mono-front"><circle cx="32" cy="36.9" r="3.6"/></clipPath>
    <mask id="lg-mono-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="rotate(-45 32 32)" fill="none">
    <rect x="14" y="25" width="20" height="14" rx="7" stroke="#000" stroke-width="3.8"/>
    <rect x="30" y="25" width="20" height="14" rx="7" stroke="#fff" stroke-width="6.8"/>
    <rect x="30" y="25" width="20" height="14" rx="7" stroke="#000" stroke-width="3.8"/>
    <g clip-path="url(#lg-mono-front)">
      <rect x="14" y="25" width="20" height="14" rx="7" stroke="#fff" stroke-width="6.8"/>
      <rect x="14" y="25" width="20" height="14" rx="7" stroke="#000" stroke-width="3.8"/>
    </g>
  </g>
    </mask>
  </defs>
  <path fill="currentColor" mask="url(#lg-mono-cut)" d="M32 3.5 54.5 11c1 .3 1.5 1.1 1.5 2.1V30c0 15.2-9.3 25.6-23.1 30.8a2.6 2.6 0 0 1-1.8 0C17.3 55.6 8 45.2 8 30V13.1c0-1 .5-1.8 1.5-2.1z"/>
</svg>
